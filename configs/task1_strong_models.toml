[experiment]
task = "task1"
name = "non_sleep_strong_models_fixed"
role = "controlled_improvement"
target = "Sleep_Quality_Score"
seed = 2026
cv_folds = 5
holdout_evaluated = false

[lightgbm]
n_estimators = 500
learning_rate = 0.03
num_leaves = 31
max_depth = -1
min_child_samples = 30
subsample = 0.9
colsample_bytree = 0.9
reg_alpha = 0.1
reg_lambda = 1.0

[catboost]
iterations = 500
learning_rate = 0.03
depth = 6
l2_leaf_reg = 5.0
loss_function = "RMSE"

[selection]
primary_metric = "oof_r2"
control_model = "elastic_alpha_0p001_l1_0p9"
control_oof_r2 = 0.7783725670589594
