[experiment]
task = "task1"
name = "non_sleep_spline_tuning"
role = "controlled_improvement"
target = "Sleep_Quality_Score"
seed = 2026
cv_folds = 5
feature_contract = "full_non_sleep"
holdout_evaluated = false

[grid]
n_knots = [4, 5, 6, 7]
degrees = [2, 3]
ridge_alphas = [3.0, 10.0, 30.0]

[selection]
primary_metric = "oof_r2"
tie_breakers = ["fold_r2_std", "oof_rmse", "transformed_width"]
control_model = "spline_k5_d3_a10"
control_oof_r2 = 0.7869007019669725
