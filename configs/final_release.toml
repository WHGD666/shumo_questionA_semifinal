[release]
version = "1.0"
status = "authorized_after_frozen_holdout"
training_role = "final_release_refit"
training_data = "all_labeled_rows"
training_rows = 10000
holdout_labels_used_for_refit = true
holdout_used_for_model_selection = false
post_holdout_tuning = false
model_directory = "outputs/models/release"
combined_manifest = "outputs/logs/final_release_model_training_manifest.json"

[input_contract]
mode = "independent_task_target_masked"
id_column = "Person_ID"
accepts_extra_columns = true
description = "Each task is evaluated independently. Its own target may be absent; every required predictor listed in the release manifest must be present."
ambiguity_disclosure = "The semifinal statement does not specify simultaneous removal of all three targets. No unvalidated chained fallback model is introduced."

[sources]
data_path = "data/raw/A题数据集.csv"
holdout_consumed_marker = "outputs/logs/final_holdout_consumed.json"
holdout_manifest = "outputs/logs/final_holdout_evaluation_manifest.json"
results_registry = "outputs/tables/final_results_registry.csv"
results_registry_manifest = "outputs/logs/final_results_registry_manifest.json"
evaluation_protocol = "configs/final_evaluation_protocol.toml"

[artifacts.task1]
filename = "task1.joblib"
target = "Sleep_Quality_Score"
selected_model = "lightgbm_residual_w0p75"

[artifacts.task2]
filename = "task2.joblib"
target = "Productivity_Score"
selected_model = "elastic_a0p01_l1_0p9"

[artifacts.task3]
filename = "task3.joblib"
target = "Health_Score"
selected_model = "additive_elastic_k4_d2_a0p003"

[submission]
package_directory = "submission/model"
results_directory = "submission/results"
model_manifest = "submission/model/model_manifest.json"
source_directory = "submission/model/source"
