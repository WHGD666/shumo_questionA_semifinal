[experiment]
task = "task1"
name = "non_sleep_structured_models"
role = "controlled_improvement"
target = "Sleep_Quality_Score"
seed = 2026
cv_folds = 5
feature_contract = "full_non_sleep"
holdout_evaluated = false

[pls_8]
n_components = 8
max_iter = 1000

[pls_16]
n_components = 16
max_iter = 1000

[spline_ridge]
n_knots = 5
degree = 3
alpha = 10.0

[catboost_native]
iterations = 800
learning_rate = 0.03
depth = 6
l2_leaf_reg = 5.0
loss_function = "RMSE"

[selection]
primary_metric = "oof_r2"
control_model = "elastic_alpha_0p001_l1_0p9"
control_oof_r2 = 0.7783725670589594
