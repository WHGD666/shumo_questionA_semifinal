[engineering]
numeric_imputation = "median"
categorical_imputation = "Missing_Unknown"
numeric_scaling = "standard"
categorical_encoding = "one_hot_ignore_unknown"

[task1]
target = "Sleep_Quality_Score"
primary_metric = "r2"
forbidden = ["Person_ID", "Sleep_Quality_Score", "Sleep_Duration_Hours", "Sleep_Time", "Wake_Up_Time", "Number_of_Night_Awakenings", "Weekend_Sleep_Difference_Hours", "Nap_Frequency_Per_Week", "Screen_Time_Before_Bed_Hours", "Sleep_Disorder_Risk"]
diagnostic_only = ["Health_Score", "Fitness_Level", "Healthy_Aging_Score", "Wellness_Category"]

[task2]
target = "Productivity_Score"
primary_metric = "adjusted_r2"
forbidden = ["Person_ID", "Productivity_Score"]
diagnostic_only = ["Health_Score", "Fitness_Level", "Healthy_Aging_Score", "Wellness_Category"]
collinearity_candidates = ["Energy_Level_Score", "Fatigue_Level_Score", "Focus_Concentration_Score", "Mood_Score", "Life_Satisfaction_Score", "Stress_Level", "Anxiety_Score", "Depression_Risk_Score"]

[task3]
target = "Health_Score"
primary_metric = "r2"
forbidden = ["Person_ID", "Health_Score"]
diagnostic_only = ["Fitness_Level", "Wellness_Category"]
strong_proxy_candidates = ["Healthy_Aging_Score", "Fitness_Level", "Wellness_Category"]
