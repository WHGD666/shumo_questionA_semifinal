[experiment]
task = "task1"
name = "non_sleep_spline_refinement"
role = "controlled_improvement"
target = "Sleep_Quality_Score"
seed = 2026
cv_folds = 5
feature_contract = "full_non_sleep"
holdout_evaluated = false
stop_after_this_grid = true

[grid]
n_knots = [3, 4]
degrees = [2]
ridge_alphas = [0.3, 1.0, 3.0, 10.0]

[selection]
primary_metric = "oof_r2"
tie_breakers = ["fold_r2_std", "oof_rmse", "transformed_width"]
control_model = "spline_k4_d2_a3p0"
control_oof_r2 = 0.7905766359789776
